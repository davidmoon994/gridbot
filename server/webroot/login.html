<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · GridBot</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131722; --border:#232a3a; --text:#e6e9ef; --muted:#838ba0;
    --amber:#e8a33d; --short:#ff6b6b;
    --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:var(--sans);
    background-image:linear-gradient(var(--border) 1px, transparent 1px),linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .card{
    width:340px; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:32px; box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; margin-bottom:24px; letter-spacing:0.3px; }
  .mark{
    width:22px; height:22px; border-radius:4px;
    background:linear-gradient(var(--amber) 1px, transparent 1px) 0 0/8px 8px, linear-gradient(90deg, var(--amber) 1px, transparent 1px) 0 0/8px 8px, #171c29;
    border:1px solid #7a5c28;
  }
  label{ font-size:12px; color:var(--muted); display:block; margin:14px 0 6px; }
  input{
    width:100%; background:#0e131d; border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:6px; font-family:var(--mono); font-size:14px;
  }
  button{
    width:100%; margin-top:20px; padding:11px; border:none; border-radius:6px;
    background:var(--amber); color:#1a1204; font-weight:700; font-size:14px; cursor:pointer;
  }
  button:hover{ filter:brightness(1.08); }
  .err{ color:var(--short); font-size:13px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"></span> GRIDBOT 登录</div>
  <form id="loginForm">
    <label>用户名</label>
    <input name="username" autocomplete="username" required />
    <label>密码</label>
    <input name="password" type="password" autocomplete="current-password" required />
    <div class="err" id="err"></div>
    <button type="submit">登录</button>
  </form>
</div>
<script>
async function checkStatus(){
  const res = await fetch('/api/auth/status');
  const data = await res.json();
  if(!data.has_account){ location.href = '/setup.html'; return; }
  if(data.logged_in){ location.href = '/'; }
}
checkStatus();

document.getElementById('loginForm').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || '登录失败'; return; }
    location.href = '/';
  } catch(e){ errEl.textContent = '网络错误: ' + e.message; }
});
</script>
</body>
</html>
